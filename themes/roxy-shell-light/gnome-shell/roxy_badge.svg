<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 32" width="110" height="32">
  <defs>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Glowing Cyan Water Dot -->
  <circle cx="12" cy="16" r="5" fill="#0284c7" opacity="0.3" filter="url(#dotGlow)" />
  <circle cx="12" cy="16" r="3.5" fill="#0284c7" />
  <circle cx="12" cy="16" r="1.8" fill="#ffffff" />
  
  <!-- RoxyOS Bold Label -->
  <text x="24" y="22" font-family="Cantarell, Inter, Ubuntu, DejaVu Sans, sans-serif" font-weight="900" font-size="16" fill="url(#textGrad)" letter-spacing="0.5">RoxyOS</text>
</svg>
