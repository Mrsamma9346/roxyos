<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <linearGradient id="pearlConch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Spiral Conch Body -->
  <path d="M 28 88 C 20 70 30 40 54 30 C 74 20 96 32 98 52 C 100 68 86 86 68 94 C 50 100 32 98 28 88 Z" 
        fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 30 86 C 24 70 32 42 54 32 C 72 22 94 34 96 52 C 98 66 84 84 66 92 C 50 98 34 96 30 86 Z" 
        fill="url(#pearlConch)"/>

  <!-- Inner Conch Spiral Curves -->
  <path d="M 54 32 C 68 44 76 60 70 78" fill="none" stroke="#0284c7" stroke-width="3"/>
  <path d="M 44 46 C 54 56 60 70 54 84" fill="none" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Concentric Water Acoustic Waves -->
  <path d="M 92 38 C 102 46 108 58 108 72 C 108 84 102 96 92 104" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#waveGlow)"/>
  <path d="M 102 28 C 114 40 120 56 120 72 C 120 88 114 104 102 116" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" filter="url(#waveGlow)"/>

  <!-- Luminous Water Droplets -->
  <circle cx="48" cy="24" r="3.5" fill="#38bdf8" filter="url(#waveGlow)"/>
  <circle cx="34" cy="36" r="2.5" fill="#7dd3fc"/>
</svg>