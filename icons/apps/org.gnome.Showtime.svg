<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <linearGradient id="prismGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Arcane Diamond / Hexagonal Projection Prism -->
  <polygon points="64,12 110,38 110,90 64,116 18,90 18,38" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" fill="url(#prismGrad)"/>

  <!-- Inner Water Crystal Facets -->
  <polygon points="64,16 106,40 64,64 22,40" fill="#7dd3fc" opacity="0.35"/>
  <polygon points="22,40 64,64 64,112 22,88" fill="#0369a1" opacity="0.4"/>
  <polygon points="106,40 64,64 64,112 106,88" fill="#0284c7" opacity="0.6"/>

  <!-- Glowing Play Glyph in Arcane Water Circle -->
  <circle cx="64" cy="64" r="24" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="8,4" filter="url(#prismGlow)"/>
  <polygon points="56,48 80,64 56,80" fill="#ffffff" filter="url(#prismGlow)"/>
  <polygon points="56,48 80,64 56,80" fill="#e0f2fe"/>
</svg>