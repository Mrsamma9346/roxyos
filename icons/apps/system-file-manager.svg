<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bookGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <!-- Book Shadow & Pages -->
  <rect x="34" y="22" width="66" height="84" rx="6" fill="#f8fafc" />
  <rect x="32" y="24" width="66" height="80" rx="4" fill="#e2e8f0" />
  
  <!-- Book Front Cover -->
  <rect x="28" y="20" width="66" height="88" rx="5" fill="url(#bookCover)" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Spine -->
  <rect x="28" y="20" width="10" height="88" rx="3" fill="#172554" />
  <line x1="38" y1="20" x2="38" y2="108" stroke="#1e40af" stroke-width="1.5" />
  
  <!-- Gold Corner Accents -->
  <path d="M 28 32 L 40 20 L 28 20 Z" fill="url(#bookGold)" />
  <path d="M 28 96 L 40 108 L 28 108 Z" fill="url(#bookGold)" />
  <path d="M 94 32 L 82 20 L 94 20 Z" fill="url(#bookGold)" />
  <path d="M 94 96 L 82 108 L 94 108 Z" fill="url(#bookGold)" />
  
  <!-- Front Cover Water Magic Seal -->
  <circle cx="65" cy="64" r="20" fill="none" stroke="#38bdf8" stroke-width="2" />
  <circle cx="65" cy="64" r="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 3" />
  <!-- Magic Star -->
  <polygon points="65,48 77,69 53,69" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="65,80 77,59 53,59" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Center Water Droplet -->
  <circle cx="65" cy="64" r="4" fill="#38bdf8" />
</svg>
