<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <linearGradient id="sealGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="deepSapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <!-- Ornate Eight-Pointed Star Medallion -->
  <g fill="url(#sealGold)" stroke="#78350f" stroke-width="1.5">
    <rect x="24" y="24" width="80" height="80" rx="16"/>
    <rect x="24" y="24" width="80" height="80" rx="16" transform="rotate(45 64 64)"/>
  </g>

  <!-- Inner Sapphire Gem Base -->
  <circle cx="64" cy="64" r="44" fill="#0f172a"/>
  <circle cx="64" cy="64" r="40" fill="url(#deepSapphire)"/>

  <!-- Arcane Migurdia Water Circle -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#sealGlow)"/>
  
  <!-- Central Water Crystal Trident / Crest -->
  <path d="M 64 34 L 70 56 L 64 52 L 58 56 Z" fill="#ffffff" filter="url(#sealGlow)"/>
  <path d="M 44 46 L 56 60 L 52 64 L 42 56 Z" fill="#7dd3fc" filter="url(#sealGlow)"/>
  <path d="M 84 46 L 72 60 L 76 64 L 86 56 Z" fill="#7dd3fc" filter="url(#sealGlow)"/>
  
  <!-- Central Water Core -->
  <circle cx="64" cy="68" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="64" cy="68" r="6" fill="#38bdf8"/>
  <circle cx="62" cy="66" r="2.5" fill="#ffffff"/>
  <circle cx="64" cy="88" r="3" fill="#facc15"/>
</svg>