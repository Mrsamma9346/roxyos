<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cyanWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Lyre Frame Shadow/Outline -->
  <path d="M 34 26 C 24 40 24 74 38 94 C 48 108 80 108 90 94 C 104 74 104 40 94 26 C 88 18 78 28 82 34 C 88 44 88 74 78 86 C 70 96 58 96 50 86 C 40 74 40 44 46 34 C 50 28 40 18 34 26 Z" 
        fill="#0f172a" stroke="#ca8a04" stroke-width="2"/>
  <path d="M 35 28 C 26 41 26 73 39 92 C 48 105 80 105 89 92 C 102 73 102 41 93 28 C 88 21 80 29 83 35 C 88 44 87 72 77 84 C 69 94 59 94 51 84 C 41 72 40 44 45 35 C 48 29 40 21 35 28 Z" 
        fill="url(#gold)"/>

  <!-- Top Crossbar with Water Gems -->
  <rect x="36" y="32" width="56" height="8" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="38" y="34" width="52" height="4" rx="2" fill="url(#gold)"/>

  <!-- Water Strings (Luminous cyan) -->
  <line x1="46" y1="36" x2="48" y2="88" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="55" y1="36" x2="56" y2="92" stroke="#7dd3fc" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="64" y1="36" x2="64" y2="94" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <line x1="73" y1="36" x2="72" y2="92" stroke="#7dd3fc" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="82" y1="36" x2="80" y2="88" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Center Sapphire Water Gem -->
  <circle cx="64" cy="98" r="8" fill="#0f172a"/>
  <circle cx="64" cy="98" r="6.5" fill="url(#cyanWater)" filter="url(#glow)"/>
  <circle cx="62" cy="96" r="2" fill="#ffffff"/>
  <!-- Musical Water Note Accent -->
  <circle cx="96" cy="22" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M 100 22 L 100 12 L 108 10 L 108 18" fill="none" stroke="#38bdf8" stroke-width="2"/>
</svg>