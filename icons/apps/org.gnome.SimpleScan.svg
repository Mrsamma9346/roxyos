<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Parchment Scroll Body -->
  <path d="M 28 20 C 34 16 46 16 52 20 L 98 20 C 106 20 110 26 108 34 L 96 102 C 94 110 86 114 78 114 L 32 114 C 24 114 20 108 22 100 L 32 28 C 30 22 24 24 28 20 Z" 
        fill="#0f172a" stroke="#b45309" stroke-width="2"/>
  <path d="M 30 22 C 36 18 46 18 50 22 L 96 22 C 102 22 106 26 104 32 L 94 100 C 92 106 86 110 80 110 L 34 110 C 28 110 24 106 26 98 L 34 30 C 32 24 26 26 30 22 Z" 
        fill="url(#parchment)"/>

  <!-- Wooden Scroll Rods -->
  <rect x="22" y="16" width="80" height="7" rx="3.5" fill="#78350f" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="22" cy="19.5" r="5" fill="#d97706"/>
  <circle cx="102" cy="19.5" r="5" fill="#d97706"/>

  <!-- Glowing Water Scanning Beam -->
  <rect x="26" y="58" width="76" height="5" rx="2.5" fill="#38bdf8" filter="url(#scanGlow)"/>
  <line x1="26" y1="60.5" x2="102" y2="60.5" stroke="#ffffff" stroke-width="2"/>

  <!-- Ancient Water Runes on parchment -->
  <line x1="38" y1="40" x2="88" y2="40" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="48" x2="78" y2="48" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="74" x2="84" y2="74" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="82" x2="74" y2="82" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="90" x2="80" y2="90" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
</svg>